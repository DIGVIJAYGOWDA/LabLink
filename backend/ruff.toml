# Lint and format settings for the backend. Run from backend/: `ruff check .` and `ruff format .`
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008: FastAPI's `Depends()` / `Query()` defaults are the framework's documented pattern.
ignore = ["B008"]

[lint.per-file-ignores]
# Tests set environment variables before importing the app.
"tests/*" = ["E402"]
